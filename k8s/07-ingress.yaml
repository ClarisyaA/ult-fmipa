apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ult-fmipa-app
  namespace: ult-fmipa
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
    - host: ult-fmipa.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ult-fmipa-app
                port:
                  number: 80
