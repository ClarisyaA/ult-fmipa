apiVersion: v1
kind: Secret
metadata:
  name: ult-fmipa-db-secret
  namespace: ult-fmipa
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: fmipa_sbpk
  MYSQL_USER: ult_user
  MYSQL_PASSWORD: ult_password
---
apiVersion: v1
kind: Secret
metadata:
  name: ult-fmipa-app-secret
  namespace: ult-fmipa
type: Opaque
stringData:
  DATABASE_URL: mysql://ult_user:ult_password@ult-fmipa-mariadb:3306/fmipa_sbpk
  DB_USER: ult_user
  DB_PASSWORD: ult_password
  NEXTAUTH_SECRET: change-me
  PAUS_CLIENT_ID: ""
  PAUS_CLIENT_SECRET: ""
  PAUS_BRIDGE_SECRET: change-me
