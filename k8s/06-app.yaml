apiVersion: apps/v1
kind: Deployment
metadata:
  name: ult-fmipa-app
  namespace: ult-fmipa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ult-fmipa-app
  template:
    metadata:
      labels:
        app: ult-fmipa-app
    spec:
      containers:
        - name: app
          image: ult-fmipa:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: ult-fmipa-app-config
            - secretRef:
                name: ult-fmipa-app-secret
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: ult-fmipa-storage
---
apiVersion: v1
kind: Service
metadata:
  name: ult-fmipa-app
  namespace: ult-fmipa
spec:
  selector:
    app: ult-fmipa-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
