services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ult-fmipa-app
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://ult_user:ult_password@db:3306/fmipa_sbpk
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ult_user
      DB_PASSWORD: ult_password
      DB_NAME: fmipa_sbpk
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@gmail.com}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-admin123}
      DEV_STAFF_EMAIL: ${DEV_STAFF_EMAIL:-staff@gmail.com}
      DEV_STAFF_PASSWORD: ${DEV_STAFF_PASSWORD:-staff123}
      DEV_STUDENT_EMAIL: ${DEV_STUDENT_EMAIL:-student@gmail.com}
      DEV_STUDENT_PASSWORD: ${DEV_STUDENT_PASSWORD:-student123}
      DEV_STUDENT_NAME: ${DEV_STUDENT_NAME:-Mahasiswa ULT}
      DEV_STUDENT_NPM: ${DEV_STUDENT_NPM:-140810230017}
      DEV_STUDENT_PHONE: ${DEV_STUDENT_PHONE:-}
      DB_ADMIN_ACCESS_CODES: ${DB_ADMIN_ACCESS_CODES:-SUPER_USER}
      DB_STAFF_ACCESS_CODES: ${DB_STAFF_ACCESS_CODES:-ADMIN,OPERATOR,KRS,PIMPINAN}
      PAUS_MODE: ${PAUS_MODE:-modern}
      PAUS_CLIENT_ID: ${PAUS_CLIENT_ID:-}
      PAUS_CLIENT_SECRET: ${PAUS_CLIENT_SECRET:-}
      PAUS_AUTHORIZATION_URL: ${PAUS_AUTHORIZATION_URL:-https://paus.unpad.ac.id/oauth/authorize}
      PAUS_TOKEN_URL: ${PAUS_TOKEN_URL:-https://paus.unpad.ac.id/oauth/token}
      PAUS_USERINFO_URL: ${PAUS_USERINFO_URL:-https://paus.unpad.ac.id/api/user}
      PAUS_SIGN_OUT_URL: ${PAUS_SIGN_OUT_URL:-https://paus.unpad.ac.id/oauth/sign-out}
      PAUS_SCOPE: ${PAUS_SCOPE:-read-user-info}
      PAUS_USERINFO_AUTH: ${PAUS_USERINFO_AUTH:-bearer}
      PAUS_GLOBAL_LOGOUT: ${PAUS_GLOBAL_LOGOUT:-true}
      PAUS_SIGN_OUT_REDIRECT_PARAM: ${PAUS_SIGN_OUT_REDIRECT_PARAM:-redirect_uri}
      PAUS_ALUMNI_FIELD: ${PAUS_ALUMNI_FIELD:-}
      PAUS_ALUMNI_VALUES: ${PAUS_ALUMNI_VALUES:-alumni,lulus}
      PAUS_ACTIVE_VALUES: ${PAUS_ACTIVE_VALUES:-}
      PAUS_REQUIRE_REGISTERED_NPM: ${PAUS_REQUIRE_REGISTERED_NPM:-true}
      AUTH_DEBUG: ${AUTH_DEBUG:-false}
      PAUS_BRIDGE_ENABLED: ${PAUS_BRIDGE_ENABLED:-false}
      PAUS_LEGACY_LOGIN_URL: ${PAUS_LEGACY_LOGIN_URL:-}
      PAUS_BRIDGE_SECRET: ${PAUS_BRIDGE_SECRET:-change-me}
      PAUS_BRIDGE_TOKEN_TTL_SECONDS: ${PAUS_BRIDGE_TOKEN_TTL_SECONDS:-120}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-ult-fmipa}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  db:
    image: mariadb:11
    container_name: ult-fmipa-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fmipa_sbpk
      MYSQL_USER: ult_user
      MYSQL_PASSWORD: ult_password
    ports:
      - "13306:3306"
    volumes:
      - ult_fmipa_db_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: ult-fmipa-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

  minio:
    image: minio/minio:latest
    container_name: ult-fmipa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Idempotent bucket bootstrap: creates the private bucket if it doesn't
  # already exist, then exits. Safe to re-run (e.g. on every `compose up`).
  minio-init:
    image: minio/mc:latest
    container_name: ult-fmipa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-ult-fmipa}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ACCESS_KEY\" \"$$MINIO_SECRET_KEY\" &&
      (mc mb local/$$MINIO_BUCKET || true) &&
      mc anonymous set none local/$$MINIO_BUCKET &&
      echo 'MinIO bucket ready (private):' \"$$MINIO_BUCKET\"
      "
    restart: "no"

volumes:
  ult_fmipa_db_data:
  minio_data:
